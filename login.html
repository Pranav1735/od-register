<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login - OD Register</title>
  <script src="config.js?v=2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&family=Outfit:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #030712;
      --card: rgba(17, 24, 39, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #6366f1;
      --text: #f9fafb;
      --muted: #9ca3af;
      --input-bg: rgba(0, 0, 0, 0.3);
      --red: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(124, 58, 237, 0.15) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem;
      width: 380px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .login-card h2 {
      font-family: 'Outfit', sans-serif;
      color: var(--accent);
      margin-bottom: 0.5rem;
      font-size: 1.8rem;
    }

    .login-card p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .login-card input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 1.1rem;
      padding: 0.8rem 1rem;
      outline: none;
      text-align: center;
      margin-bottom: 1.5rem;
      transition: 0.3s;
    }

    .login-card input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.9rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .login-err {
      color: var(--red);
      font-size: 0.85rem;
      margin-top: 1rem;
      font-weight: 500;
      display: none;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <h2>🔐 Staff Login</h2>
    <p>Enter your credentials to continue</p>
    <input type="text" id="loginIdInput" placeholder="Login ID" />
    <input type="password" id="loginPwInput" placeholder="Password" onkeydown="if(event.key==='Enter') doLogin()" />
    <button class="login-btn" onclick="doLogin()">Proceed to Form</button>
    <div class="login-err" id="loginErr">Invalid credentials or missing details.</div>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('od_session_id')) {
      window.location.href = 'index.html';
    }

    function doLogin() {
      const id = document.getElementById('loginIdInput').value.trim();
      const pw = document.getElementById('loginPwInput').value.trim();

      if (id && STAFF_ACCOUNTS[id] === pw) {
        localStorage.setItem('od_session_id', id);
        // REDIRECT TO OD ENTRY FORM
        window.location.href = 'index.html';
      } else {
        document.getElementById('loginErr').style.display = 'block';
      }
    }
  </script>
</body>

</html>
