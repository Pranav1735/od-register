<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OD Entry Form</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=2"></script>
  <script src="branches.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #030712;
      --card: rgba(17, 24, 39, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.5);
      --text: #f9fafb;
      --muted: #9ca3af;
      --glass: rgba(255, 255, 255, 0.03);
      --input-bg: rgba(0, 0, 0, 0.3);
      --green: #10b981;
      --red: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(124, 58, 237, 0.15) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      padding: 3rem 1rem;
      line-height: 1.5;
    }

    .header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    .header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(to right, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 500;
    }

    .card {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .section-title::after {
      content: '';
      height: 1px;
      flex: 1;
      background: linear-gradient(to right, var(--border), transparent);
    }

    .field {
      margin-bottom: 1.5rem;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.6rem;
      transition: color 0.2s;
    }

    .field:focus-within label {
      color: var(--accent);
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.8rem 1rem;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.05);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .field input.filled {
      border-color: var(--green);
      background: rgba(16, 185, 129, 0.05);
    }

    .field input:read-only {
      opacity: 0.7;
      cursor: not-allowed;
      border-style: dashed;
    }

    .logout-btn {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.2);
      color: var(--red);
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 100;
    }

    .logout-btn:hover {
      background: var(--red);
      color: #fff;
      transform: translateY(-1px);
    }

    /* Fix for select dropdown visibility */
    select option {
      background-color: #111827;
      color: #f9fafb;
      padding: 10px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .timing-grid {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.3rem;
      flex-wrap: nowrap;
    }

    .timing-grid select {
      border: none;
      background: transparent;
      padding: 0.5rem;
      font-weight: 500;
    }

    .timing-grid select:focus {
      box-shadow: none;
    }

    .timing-grid .to-divider {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    .divider {
      border: none;
      height: 1px;
      background: var(--border);
      margin: 2rem 0;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.4);
      filter: brightness(1.1);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .toast {
      position: fixed;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      color: #fff;
      padding: 1rem 2rem;
      border-radius: 100px;
      font-weight: 600;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 999;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.error-toast {
      border-color: var(--red);
      color: var(--red);
    }

    .admin-link {
      text-align: center;
      margin-top: 2.5rem;
      color: var(--muted);
    }

    .admin-link a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s;
    }

    .admin-link a:hover {
      text-decoration: underline;
    }

    .reg-hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    .reg-hint span {
      color: var(--accent);
      font-family: 'Space Mono', monospace;
    }

    .name-suggest-field {
      position: relative;
    }

    .name-suggestions {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% - 0.85rem);
      z-index: 40;
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 12px;
      max-height: 260px;
      overflow-y: auto;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .name-suggestions.open {
      display: block;
    }

    .name-suggestion {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text);
      padding: 0.7rem 1rem;
      cursor: pointer;
      font-family: inherit;
    }

    .name-suggestion:last-child {
      border-bottom: none;
    }

    .name-suggestion:hover,
    .name-suggestion.active {
      background: rgba(99, 102, 241, 0.16);
    }

    .name-suggestion .sug-name {
      font-weight: 600;
      font-size: 0.92rem;
    }

    .name-suggestion .sug-meta {
      font-size: 0.72rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.02em;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem 0.5rem;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .two-col {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .card {
        padding: 1.25rem;
        border-radius: 16px;
        margin-top: 0;
      }

      .timing-grid {
        flex-direction: column;
        align-items: stretch;
        padding: 0.5rem;
      }

      .timing-grid .to-divider {
        text-align: center;
        font-size: 0.6rem;
        opacity: 0.5;
      }

      .timing-grid select {
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <div id="mainApp">
    <button onclick="logout()" class="logout-btn">Log Out</button>
    <div class="header">
      <h1>📋 OD Entry Form</h1>
      <p>Enter student details below — Branch &amp; Year fill automatically</p>
    </div>

    <div class="card">
      <!-- Event Details -->
      <div class="section-title">Event Details</div>
      <div class="field">
        <label>Camp Name</label>
        <input type="text" id="campName" placeholder="e.g. NSS Camp 2026" />
      </div>

      <hr class="divider" />

      <!-- Register Number -->
      <div class="section-title">Student Details</div>
    <div class="field">
      <label>Register Number</label>
      <input type="text" id="regNo" maxlength="9" placeholder="e.g. 126CCCDD" autocomplete="off"
        oninput="handleRegNo(this.value)"
        style="font-family:'Space Mono',monospace; font-size:1.1rem; letter-spacing:2px;" />
      <div class="reg-hint">Format: <span>1 BB CCC DDD</span> — 9 digits total</div>
    </div>

    <div class="two-col">
      <div class="field">
        <label>Program / Branch <span class="auto-badge">AUTO</span></label>
        <input type="text" id="program" readonly placeholder="Auto-filled" />
      </div>
      <div class="field">
        <label>Year <span class="auto-badge">AUTO</span></label>
        <input type="text" id="year" placeholder="Auto-filled" />
      </div>
    </div>

    <div class="field">
      <label>Name of the Student</label>
      <input type="text" id="studentName" placeholder="Full name" />
    </div>

    <hr class="divider" />

    <!-- OD Details -->
    <div class="section-title">OD Details</div>
    <div class="two-col">
      <div class="field">
        <label>Timing Range</label>
        <div class="timing-grid">
          <select id="fromTime" onchange="checkTimeLogic('from')">
            <option value="">From</option>
            <option value="8.45 AM">8.45 AM</option>
            <option value="9.45 AM">9.45 AM</option>
            <option value="11 AM">11 AM</option>
            <option value="12 PM">12 PM</option>
            <option value="1 PM">1 PM</option>
            <option value="2 PM">2 PM</option>
            <option value="3 PM">3 PM</option>
            <option value="4.15 PM">4.15 PM</option>
            <option value="5.15 PM">5.15 PM</option>
            <option value="FULL DAY">FULL DAY</option>
          </select>
          <div class="to-divider">to</div>
          <select id="toTime" onchange="checkTimeLogic('to')">
            <option value="">To</option>
            <option value="8.45 AM">8.45 AM</option>
            <option value="9.45 AM">9.45 AM</option>
            <option value="11 AM">11 AM</option>
            <option value="12 PM">12 PM</option>
            <option value="1 PM">1 PM</option>
            <option value="2 PM">2 PM</option>
            <option value="3 PM">3 PM</option>
            <option value="4.15 PM">4.15 PM</option>
            <option value="5.15 PM">5.15 PM</option>
            <option value="FULL DAY">FULL DAY</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Place / Location</label>
        <input type="text" id="place" placeholder="Venue" oninput="syncField('place', this.value)" />
      </div>
    </div>

    <div class="field">
      <label>Activity Description</label>
      <textarea id="activityDesc" placeholder="Describe the activity or event..."></textarea>
    </div>

    <div class="two-col">
      <div class="field">
        <label>From Date</label>
        <input type="date" id="fromDate" />
      </div>
      <div class="field">
        <label>To Date</label>
        <input type="date" id="toDate" />
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitEntry()">Submit Entry</button>
  </div>

  <div style="text-align:center; margin-top:1rem;">
    <button onclick="hardReset()"
      style="background:none; border:none; color:var(--muted); font-size:0.75rem; cursor:pointer; text-decoration:underline;">
      Reset All Fields (Clear Cache)
    </button>
  </div>

    <div class="admin-link">
      <div style="margin-bottom:0.8rem; font-size:0.75rem; color:var(--muted);">
        Developed by <a href="http://www.xiqro.in" target="_blank"
          style="color:var(--accent); text-decoration:none; font-weight:600;">Xiqro - Next Gen</a>
      </div>
      <a href="admin.html">🔐 Admin Dashboard →</a>
    </div>
  </div> <!-- Close mainApp div -->

  <div class="toast" id="toast"></div>

  <script>
    // Init Supabase
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const STORAGE_KEY = 'od_form_data';

    function syncField(id, val) {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      saved[id] = val;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    }

    function checkTimeLogic() {
      const fromEl = document.getElementById('fromTime');
      const toEl = document.getElementById('toTime');

      toEl.disabled = false;
      Array.from(toEl.options).forEach(opt => { opt.disabled = false; });

      syncField('fromTime', fromEl.value);
      syncField('toTime', toEl.value);
    }

    // Load saved data on start
    window.onload = () => {
      // Check login session
      const sid = localStorage.getItem('od_session_id');
      if (!sid) {
        window.location.href = 'login.html';
        return;
      }

      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        Object.keys(data).forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.value = data[id];
            if (id === 'regNo') handleRegNo(data[id]);
          }
        });
        // Restore specific logic states
        if (data.fromTime || data.toTime) checkTimeLogic('init');
      }
    };

    // Attach listeners to fields for persistence
    ['campName', 'regNo', 'studentName', 'program', 'year', 'fromTime', 'toTime', 'place', 'activityDesc', 'fromDate', 'toDate'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', (e) => {
        syncField(id, e.target.value);
      });
    });

    function handleRegNo(val) {
      const progInput = document.getElementById('program');
      const yearInput = document.getElementById('year');

      progInput.classList.remove('filled', 'error');
      yearInput.classList.remove('filled', 'error');
      progInput.readOnly = true;
      yearInput.readOnly = true;

      if (val.length !== 9) {
        progInput.value = '';
        yearInput.value = '';
        return;
      }

      const result = parseRegisterNo(val);
      if (!result) {
        progInput.value = 'Invalid format';
        progInput.classList.add('error');
        return;
      }

      if (result.unknown) {
        progInput.readOnly = false;
        progInput.value = '';
        progInput.placeholder = 'Type Branch Name...';
        yearInput.readOnly = false;
        yearInput.value = '';
        yearInput.placeholder = 'Type Year...';
        progInput.focus();
      } else {
        progInput.value = result.branch;
        yearInput.value = result.year;
        progInput.classList.add('filled');

        if (result.year !== 'Fill Manually' && result.year !== '—') {
          yearInput.classList.add('filled');
          yearInput.readOnly = true;
        } else {
          yearInput.readOnly = false;
          yearInput.value = '';
          yearInput.placeholder = 'Enter year manually';
        }
      }
    }

    async function submitEntry() {
      const btn = document.getElementById('submitBtn');
      const regNo = document.getElementById('regNo').value.trim();
      const studentName = document.getElementById('studentName').value.trim();
      const program = document.getElementById('program').value.trim();
      const year = document.getElementById('year').value.trim();

      const fromT = document.getElementById('fromTime').value;
      const toT = document.getElementById('toTime').value;
      let odTiming = '';

      if (fromT === 'FULL DAY' && toT === 'FULL DAY') {
        odTiming = 'FULL DAY';
      } else if (fromT && toT) {
        odTiming = `${fromT} to ${toT}`;
      }

      const activityDesc = document.getElementById('activityDesc').value.trim();
      const place = document.getElementById('place').value.trim();
      const fromDate = document.getElementById('fromDate').value;
      const toDate = document.getElementById('toDate').value;
      const enteredBy = localStorage.getItem('od_session_id');
      const campName = document.getElementById('campName').value.trim();

      if (!regNo || regNo.length !== 9) { showToast('Enter a valid 9-digit Register Number', true); return; }
      if (!studentName) { showToast('Enter student name', true); return; }
      if (!enteredBy) { showToast('Session expired. Please reload and login.', true); return; }
      if (!campName) { showToast('Enter camp name', true); return; }
      if (!odTiming) { showToast('Select OD timing', true); return; }
      if (!fromDate || !toDate) { showToast('Select From and To dates', true); return; }

      btn.disabled = true;
      btn.textContent = 'Submitting...';

      const { error } = await db.from('od_entries').insert({
        register_no: regNo,
        student_name: studentName,
        program,
        year,
        od_timing: odTiming,
        activity_description: activityDesc,
        place,
        from_date: fromDate,
        to_date: toDate,
        entered_by: enteredBy,
        camp_name: campName,
      });

      btn.disabled = false;
      btn.textContent = 'Submit Entry';

      if (error) {
        console.error(error);
        showToast('Error saving. Check Supabase config.', true);
      } else {
        showToast('✅ Entry saved successfully!');
        clearForm();
        // Keep relevant data in localStorage but remove student-specific ones
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        delete saved.regNo;
        delete saved.studentName;
        delete saved.program;
        delete saved.year;
        // We don't clear fromTime/toTime as per user preference to stay for continuous entries
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
      }
    }

    function clearForm() {
      ['regNo', 'studentName'].forEach(id => {
        document.getElementById(id).value = '';
      });
      // Explicitly sync the clear to localStorage
      syncField('regNo', '');
      syncField('studentName', '');
      const prog = document.getElementById('program');
      const yr = document.getElementById('year');
      prog.value = ''; prog.classList.remove('filled', 'error');
      yr.value = ''; yr.classList.remove('filled', 'error');
      yr.readOnly = true;
      yr.placeholder = 'Auto-filled';

      // Focus back on Register Number for next student
      document.getElementById('regNo').focus();
    }

    function hardReset() {
      if (!confirm('This will log you out and clear all fields. Continue?')) return;
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem('od_session_id');
      localStorage.removeItem('od_session_camp');
      location.reload();
    }

    function logout() {
      localStorage.removeItem('od_session_id');
      localStorage.removeItem('od_session_camp');
      window.location.href = 'login.html';
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast' + (isError ? ' error-toast' : '');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // Name suggestions from previously saved students.
    // Picking a name fills register number, branch, and year.
    let studentDirectory = [];
    let directoryLoaded = false;
    let directoryPromise = null;
    let nameMatches = [];
    let activeSuggestion = -1;

    function loadStudentDirectory(force = false) {
      if (!force && directoryLoaded) return Promise.resolve();
      if (directoryPromise) return directoryPromise;
      directoryPromise = (async () => {
        const rows = [];
        const pageSize = 1000;
        for (let from = 0; from < 5000; from += pageSize) {
          const { data, error } = await db
            .from('od_entries')
            .select('student_name, register_no, program, year, created_at')
            .order('created_at', { ascending: false })
            .range(from, from + pageSize - 1);
          if (error || !data || !data.length) break;
          rows.push(...data);
          if (data.length < pageSize) break;
        }

        const byReg = new Map();
        rows.forEach(row => {
          const reg = (row.register_no || '').trim();
          const name = (row.student_name || '').trim();
          if (!reg || !name || byReg.has(reg)) return;
          byReg.set(reg, {
            student_name: name,
            register_no: reg,
            program: (row.program || '').trim(),
            year: (row.year || '').trim(),
          });
        });
        studentDirectory = [...byReg.values()];
        directoryLoaded = true;
      })().finally(() => {
        directoryPromise = null;
      });
      return directoryPromise;
    }

    function matchStudents(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      const starts = [];
      const contains = [];
      studentDirectory.forEach(student => {
        const name = student.student_name.toLowerCase();
        if (name.startsWith(q)) starts.push(student);
        else if (name.includes(q)) contains.push(student);
      });
      const byName = (a, b) => a.student_name.localeCompare(b.student_name);
      starts.sort(byName);
      contains.sort(byName);
      return starts.concat(contains).slice(0, 8);
    }

    function hideNameSuggestions() {
      const box = document.getElementById('nameSuggestions');
      if (!box) return;
      box.classList.remove('open');
      box.innerHTML = '';
      nameMatches = [];
      activeSuggestion = -1;
    }

    function renderNameSuggestions(matches) {
      const box = document.getElementById('nameSuggestions');
      box.innerHTML = '';
      nameMatches = matches;
      if (!matches.length) {
        box.classList.remove('open');
        activeSuggestion = -1;
        return;
      }
      if (activeSuggestion < 0 || activeSuggestion >= matches.length) activeSuggestion = 0;
      matches.forEach((student, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'name-suggestion' + (i === activeSuggestion ? ' active' : '');
        btn.dataset.index = String(i);
        const name = document.createElement('span');
        name.className = 'sug-name';
        name.textContent = student.student_name;
        const meta = document.createElement('span');
        meta.className = 'sug-meta';
        meta.textContent = [student.register_no, student.program, student.year].filter(Boolean).join('  ·  ');
        btn.append(name, meta);
        box.appendChild(btn);
      });
      box.classList.add('open');
      const active = box.querySelector('.name-suggestion.active');
      if (active) {
        const top = active.offsetTop;
        const bottom = top + active.offsetHeight;
        if (top < box.scrollTop) box.scrollTop = top;
        else if (bottom > box.scrollTop + box.clientHeight) box.scrollTop = bottom - box.clientHeight;
      }
    }

    async function refreshNameSuggestions() {
      const input = document.getElementById('studentName');
      const query = input.value;
      if (!query.trim()) {
        hideNameSuggestions();
        return;
      }
      if (directoryPromise) await directoryPromise;
      else await loadStudentDirectory(false);
      if (document.getElementById('studentName').value !== query) return;
      renderNameSuggestions(matchStudents(query));
    }

    function applyStudentSuggestion(student) {
      const nameEl = document.getElementById('studentName');
      const regEl = document.getElementById('regNo');
      nameEl.value = student.student_name;
      regEl.value = student.register_no;
      handleRegNo(student.register_no);

      const prog = document.getElementById('program');
      const year = document.getElementById('year');
      if (student.program) {
        prog.value = student.program;
        prog.classList.add('filled');
        prog.classList.remove('error');
      }
      if (student.year && student.year !== '—' && student.year !== 'Fill Manually') {
        year.value = student.year;
        year.readOnly = true;
        year.classList.add('filled');
        year.classList.remove('error');
      }

      syncField('studentName', nameEl.value);
      syncField('regNo', regEl.value);
      syncField('program', prog.value);
      syncField('year', year.value);
      hideNameSuggestions();
      nameEl.focus();
    }

    function setupNameSuggestions() {
      const nameEl = document.getElementById('studentName');
      if (!nameEl || document.getElementById('nameSuggestions')) return;

      nameEl.setAttribute('autocomplete', 'off');
      nameEl.parentElement.classList.add('name-suggest-field');
      const box = document.createElement('div');
      box.id = 'nameSuggestions';
      box.className = 'name-suggestions';
      nameEl.insertAdjacentElement('afterend', box);

      nameEl.addEventListener('input', () => {
        activeSuggestion = -1;
        refreshNameSuggestions();
      });

      nameEl.addEventListener('focus', () => {
        loadStudentDirectory(true).then(() => {
          if (document.activeElement === nameEl && nameEl.value.trim()) refreshNameSuggestions();
        });
      });

      nameEl.addEventListener('keydown', (e) => {
        if (!nameMatches.length || !box.classList.contains('open')) return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          activeSuggestion = (activeSuggestion + 1) % nameMatches.length;
          renderNameSuggestions(nameMatches);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          activeSuggestion = (activeSuggestion - 1 + nameMatches.length) % nameMatches.length;
          renderNameSuggestions(nameMatches);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const pick = nameMatches[activeSuggestion] || nameMatches[0];
          if (pick) applyStudentSuggestion(pick);
        } else if (e.key === 'Escape') {
          hideNameSuggestions();
        }
      });

      box.addEventListener('mousedown', (e) => {
        const btn = e.target.closest('.name-suggestion');
        if (!btn) return;
        e.preventDefault();
        const pick = nameMatches[Number(btn.dataset.index)];
        if (pick) applyStudentSuggestion(pick);
      });

      document.addEventListener('click', (e) => {
        if (e.target === nameEl || box.contains(e.target)) return;
        hideNameSuggestions();
      });
    }

    const clearFormAfterSubmit = clearForm;
    clearForm = function () {
      clearFormAfterSubmit();
      hideNameSuggestions();
    };

    window.addEventListener('load', () => {
      if (!localStorage.getItem('od_session_id')) return;
      setupNameSuggestions();
      loadStudentDirectory();
    });
  </script>
</body>

</html>
